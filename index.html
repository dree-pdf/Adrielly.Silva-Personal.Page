<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Prática 2 - Portfólio</title>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FAF7F2;
            color: #4A3F35;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            color: #D4A373;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #7A6F65;
        }
        .container-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        a {
            text-decoration: none;
            color: #fff;
            background-color: #D4A373;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        a:hover {
            background-color: #b88656;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <h1>Atividade Prática 2 - GAC116</h1>
    <p>Selecione a versão do framework CSS que deseja visualizar:</p>

    <div class="container-links">
        <!-- O link aponta para a pasta bootstrap -->
        <a href="bootstrap/index.html">Versão Bootstrap</a>
        
        <!-- O link aponta para a pasta do materialize -->
        <a href="materialize/index.html">Versão Materialize</a>
    </div>

</body>
</html>
